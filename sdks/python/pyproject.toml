[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trust-infra-sdk"
version = "1.0.0"
description = "Python SDK for the AI Transaction Authorization Infrastructure /v1 API: canonicalize + HMAC-sign requests, verify Ed25519 decision signatures, explicit fail-mode control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Trust Infrastructure", email = "sdk@trust-infra.dev" }]
keywords = ["authorization", "payments", "agents", "ed25519", "audit", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  # Ed25519 verify/sign. The only hard runtime dependency; everything else is stdlib.
  "cryptography>=41.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://trust-infra.dev"
Documentation = "https://contracts.trust-infra.dev/v1"
Source = "https://github.com/trust-infra/trust-infra"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
